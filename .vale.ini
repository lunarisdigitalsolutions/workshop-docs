# Vale prose linter: https://vale.sh
# Run `vale sync` once to download the Microsoft style package.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = PizzaLuna
Packages = Microsoft

[docs/**/*.md]
BasedOnStyles = Vale, Microsoft, PizzaLuna
# Too noisy for short technical pages
Microsoft.Headings = NO
Microsoft.Contractions = NO
Microsoft.We = NO
