# Publishes the documentation portal to GitHub Pages after every merge to main.
name: 'Docs: Publish'

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/WebApi/**'
      - 'src/DeveloperPortal/**'
      - 'scripts/generate-api-reference.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for "last updated" metadata
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: src/DeveloperPortal/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
